version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Angular 22 peer range is typescript >=6.0 <6.1. Remove this ignore
      # (or keep only semver-major) once Angular allows a newer TypeScript line.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
